<header><h3>Video List</h3></header>

<button
  // Do clicky things
  (click)="showDetails.update((v) => !v)"
>
  Toggle Details
</button>

@for (video of videos(); track video.id) {
  <button
    class="button-reset"
    (click)="rememberSelectedVideo(video)"
    [class.highlighted]="video === currentVideo()"
  >
    <ns-video-thumbnail [video]="video" />
  </button>
}
