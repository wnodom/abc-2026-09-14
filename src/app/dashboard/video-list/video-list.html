<p>video-list works!</p>

<!-- This is still just text -->

<button
  // Do clicky things
  (click)="showDetails.update((v) => !v)"
>
  Toggle Details
</button>

@for (video of videos(); track video.id) {
  <button
    class="button-reset"
    (click)="rememberSelectedVideo(video)"
    [class.highlighted]="video === currentVideo()"
  >
    {{ video.title }}

    @if (showDetails()) {
      - {{ video.author | uppercase }}
    }
  </button>
}
